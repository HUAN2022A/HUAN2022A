name: WakaTime Stats

on:
  schedule:
    - cron: "0 2 * * *" # 每天刷新（排在 snake / 3d-contrib 之后）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: HUAN2022A/waka-readme-stats@a2ecbf0fe292616a298129c83063314f7518a639  # fork pinned: PUSH_TOKEN fix, see fork README
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAX_REPOS: 8
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_PROFILE_VIEWS: false
